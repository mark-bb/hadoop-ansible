--- 
- name: Stop Spark History Server
  ansible.builtin.include_tasks: stop.yml

- name: Copy Spark configs
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  with_items:
    - { src: "spark.sh.j2",            dest: "{{ spark_profile }}" }
    - { src: "spark-env.sh.j2",        dest: "{{ spark_conf_dir ~ '/spark-env.sh' }}" }
    - { src: "spark-defaults.conf.j2", dest: "{{ spark_conf_dir ~ '/spark-defaults.conf' }}" }
    - { src: "metrics.properties.j2",  dest: "{{ spark_conf_dir ~ '/metrics.properties' }}" }

- name: Set the workers file
  ansible.builtin.copy:
    content: "{{ groups[spark_workers_group] | join('\n') }}"
    dest: "{{ spark_conf_dir ~ '/workers' }}"

- name: Start Spark History Server
  ansible.builtin.include_tasks: start.yml
    
