---
- name: Install hdfs in HA env
  ansible.builtin.import_tasks: install-ha.yml
  when: 
    - play_action == "install"
    - with_hdfs | bool
    - with_hdfs_ha | bool

- name: Start hdfs in HA env
  ansible.builtin.import_tasks: start-hdfs-ha.yml
  when: 
    - play_action == "start"
    - with_hdfs | bool
    - with_hdfs_ha | bool

- name: Stop hdfs
  ansible.builtin.import_tasks: stop-hdfs.yml
  when: 
    - play_action == "stop"
    - with_hdfs | bool
    
